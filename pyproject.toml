[project]
name = "rag-kb"
version = "0.1.0"
description = "RAG 企业知识库问答系统 —— LangGraph + FastAPI + 混合检索（稠密 + BM25 + RRF + 精排）"
readme = "README.md"
requires-python = ">=3.11, <3.13"  # 收窄：onnxruntime-gpu 1.22 无 py3.13 包（实际跑 3.11）
dependencies = [
    # ---- LLM 与向量化 ----
    "langchain>=1.3.14",
    "langchain-community<0.4.2",
    "langchain-deepseek>=1.1.0",
    "dashscope>=1.26.4",
    # ---- 检索 ----
    "langchain-chroma>=1.1.0",
    "bm25s>=0.3.10",
    "jieba>=0.42.1",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",            # 清华源装下来即为 CPU 版（与本机环境一致）
    # ---- 文档解析 ----
    "langchain-mineru>=0.1.3",
    "mineru-open-sdk>=0.2.5",
    "pypdf>=6.14.2",
    "langchain-text-splitters>=1.1.2",
    # ---- 服务端 ----
    "fastapi>=0.140.7",
    "uvicorn>=0.35.0",
    "sse-starlette>=2.3.8",     # SSE 流式响应
    "python-multipart>=0.0.20", # FastAPI 文件上传
    "aiosqlite>=0.22.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "python-dotenv>=1.2.2",
    # ---- 演示文档生成（scripts/） ----
    "python-docx>=1.1.2",
    "fpdf2>=2.8.2",
    "docx2txt>=0.9",
    "jiter>=0.16.0",
    "ragas<0.4.2",
    "langchain-google-vertexai>=3.2.4",
    "pandas-stubs~=3.0.5",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "onnxruntime-gpu==1.22.0",
    "mcp>=2.1.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = []
